      const [isScanning, setIsScanning] = useState(false);
      const [scanResult, setScanResult] = useState(null);
      const [capturedImage, setCapturedImage] = useState(null);

      // Search state
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');

      // Camera stream management
      const videoRef = useRef(null);
      const [cameraActive, setCameraActive] = useState(false);
      const [facingMode, setFacingMode] = useState('environment'); // 'environment' (back) or 'user' (front)
      const [cameraError, setCameraError] = useState(null);
      const streamRef = useRef(null);
      const fileInputRef = useRef(null);

      // Calculations
      const consumedCal = meals.reduce((acc, m) => acc + m.cal, 0);
      const consumedP = meals.reduce((acc, m) => acc + m.p, 0);
      const consumedC = meals.reduce((acc, m) => acc + m.c, 0);
      const consumedF = meals.reduce((acc, m) => acc + m.f, 0);
      const remainingCal = Math.max(0, user.dailyCal - consumedCal + user.exerciseBurn);

      // Start Camera Stream
      const startCamera = async (mode = facingMode) => {
        setCameraError(null);
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(track => track.stop());
        }

        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error("Camera API not supported in this browser. Please use Gallery Upload.");
          }

          const stream = await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: mode },
              width: { ideal: 720 },
              height: { ideal: 720 }
            },
            audio: false
          });

          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play();
            setCameraActive(true);
          }
        } catch (err) {
          console.warn("Camera access error:", err);
          setCameraError(err.message || "Camera permission denied or unavailable on this device.");
          setCameraActive(false);
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(track => track.stop());
          streamRef.current = null;
        }
        setCameraActive(false);
      };

      // Toggle camera facing mode (front / back)
      const flipCamera = () => {
        const nextMode = facingMode === 'environment' ? 'user' : 'environment';
        setFacingMode(nextMode);
        startCamera(nextMode);
      };

      // Effect: start camera when entering scan tab, stop when leaving
      useEffect(() => {
        if (activeTab === 'scan' && !scanResult) {
          startCamera();
        } else {
          stopCamera();
        }
        return () => stopCamera();
      }, [activeTab, scanResult]);

      // Capture frame from video or fallback canvas
      const captureSnapshot = () => {
        let snapshotUrl = null;
        if (videoRef.current && cameraActive) {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = videoRef.current.videoWidth || 480;
            canvas.height = videoRef.current.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
            snapshotUrl = canvas.toDataURL('image/jpeg', 0.85);
          } catch (e) {
            console.error("Canvas capture error:", e);
          }
        }

        setCapturedImage(snapshotUrl);
        stopCamera();
        runAiAnalysis("Ghar Ki Desi Thali (Scanned)", snapshotUrl);
      };

      // Handle Gallery / File upload
      const handleFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const imgData = event.target.result;
            setCapturedImage(imgData);
            stopCamera();
            runAiAnalysis("Uploaded Thali Meal", imgData);
          };
          reader.readAsDataURL(file);
        }
      };

      // AI Analysis Engine with Cooking Style Adjustments
      const runAiAnalysis = (title = "Desi Thali Special", image = null) => {
        setIsScanning(true);
        setTimeout(() => {
          let multiplier = cookingStyle === 'ghee' ? 1.25 : cookingStyle === 'dhaba' ? 1.40 : 1.0;
          let fatMultiplier = cookingStyle === 'ghee' ? 1.45 : cookingStyle === 'dhaba' ? 1.65 : 1.0;

          const baseItems = [
            { name: "Bajre Ki Roti (2 pcs)", cal: Math.round(230 * multiplier), p: 6.4, c: 44, f: Math.round(2.8 * fatMultiplier), scale: 1 },
            { name: "Gatte Ki Sabzi (1 katori)", cal: Math.round(185 * multiplier), p: 7.0, c: 14.5, f: Math.round(11.2 * fatMultiplier), scale: 1 },
            { name: "Spiced Jeera Chaas", cal: 55, p: 3.4, c: 5.0, f: 2.2, scale: 1 }
          ];

          setScanResult({
            title: title,
            image: image,
            items: baseItems,
            totalCal: baseItems.reduce((s, i) => s + i.cal, 0),
            p: Math.round(baseItems.reduce((s, i) => s + i.p, 0)),
            c: Math.round(baseItems.reduce((s, i) => s + i.c, 0)),

          });
          setIsScanning(false);
        }, 1100);
      };

      const updateItemScale = (idx, sc) => {
        if (!scanResult) return;
        const newItems = [...scanResult.items];
        newItems[idx].scale = sc;
        const totalCal = Math.round(newItems.reduce((s, i) => s + (i.cal * i.scale), 0));

        setScanResult(null);

                      </button>

                      {/* Gallery / File Upload Button */}
                      <button 
                        onClick={() => fileInputRef.current && fileInputRef.current.click()} 
                        className="w-12 h-12 rounded-full bg-nutraCard border border-nutraBorder flex items-center justify-center text-lg tap-scale shadow-sm"
                        title="Choose from Gallery"
                      >
                        🖼️
                      </button>
                    </div>

                    {/* One-Tap Realistic Food Demo Presets (Instant scan tests) */}
                    <div className="space-y-1.5 pt-2">
                      <div className="text-[11px] font-bold text-nutraSec uppercase tracking-wider text-center">Or Try Instant Preset Scans</div>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          onClick={() => runAiAnalysis("Rajasthani Dal Baati Churma Thali")}
                          className="p-2.5 bg-nutraCard border border-nutraBorder rounded-2xl text-left tap-scale"
                        >
                          <div className="font-bold text-xs">Dal Baati Churma</div>
                          <div className="text-[10px] text-nutraSec">Traditional royal meal</div>
                        </button>
                        <button
                          onClick={() => runAiAnalysis("Ghar Ki Bajre Ki Roti & Gatte")}
                          className="p-2.5 bg-nutraCard border border-nutraBorder rounded-2xl text-left tap-scale"
                        >
                          <div className="font-bold text-xs">Bajra Roti & Gatte</div>
                          <div className="text-[10px] text-nutraSec">Low glycemic thali</div>
                        </button>
                      </div>
                    </div>

                    {/* Scanning Animation Modal */}
                    {isScanning && (
                      <div className="fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center p-6 text-center">
                        <div className="bg-white text-black p-6 rounded-3xl max-w-xs shadow-2xl space-y-3">
                          <div className="w-12 h-12 border-4 border-nutraGreen border-t-transparent rounded-full animate-spin mx-auto"></div>
                          <h4 className="font-bold text-sm">Scanning Indian Plate...</h4>
                          <p className="text-xs text-nutraSec">Extracting katoris, estimating grams & oil content via ICMR-NIN database...</p>
                        </div>
                      </div>
                    )}
                  </div>
                )}

              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 4: INTERMITTENT FASTING (Popular Cal AI Feature) */}
            {/* ======================================================== */}
            {activeTab === 'fasting' && (
              <div className="space-y-4">
                <div className="space-y-1">
                  <h2 className="text-xl font-bold tracking-tight">{t.fastingTitle}</h2>
                  <p className="text-xs text-nutraSec">16:8 Lean Fasting Protocol (Autophagy & Insulin Reset).</p>
                </div>

                {/* Fasting Circular Timer Card */}
                <div className="bg-nutraCard rounded-3xl p-6 text-center shadow-sm border border-nutraBorder/60 space-y-3">
                  <span className="text-xs font-bold bg-nutraGreen/15 text-nutraGreen px-3 py-1 rounded-full">
                    {t.fatBurn}
                  </span>

                  <div className="relative w-44 h-44 mx-auto flex items-center justify-center my-2">
                    <svg className="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
                      <circle cx="50" cy="50" r="42" stroke="#EAEAEF" strokeWidth="7" fill="none" />
                      <circle 
                        cx="50" cy="50" r="42" 
                        stroke="#34C759" 
                        strokeWidth="7" 
                        strokeDasharray="264" 
                        strokeDashoffset={264 - (264 * (user.fastingHours / user.fastingTarget))} 
                        strokeLinecap="round" 
                        fill="none" 
                      />
                    </svg>
                    <div className="absolute inset-0 flex flex-col items-center justify-center">
                      <span className="text-3xl font-black">{user.fastingHours}h 20m</span>
                      <span className="text-[11px] text-nutraSec font-semibold">of {user.fastingTarget}h goal</span>
                    </div>
                  </div>

                  <div className="text-xs text-nutraSec">
                    Eating window opens in <strong className="text-black">1 hr 40 min</strong>
                  </div>

                  <div className="grid grid-cols-2 gap-2 pt-2">
                    <button 
                      onClick={() => alert("Fasting window adjusted!")}
                      className="bg-white border border-nutraBorder py-2.5 rounded-2xl text-xs font-bold tap-scale shadow-sm"
                    >
                      End Fast
                    </button>
                    <button 
                      onClick={() => alert("Fast logged successfully.")}
                      className="bg-black text-white py-2.5 rounded-2xl text-xs font-bold tap-scale shadow-sm"
                    >
                      Extend Fast +1h
                    </button>
                  </div>
                </div>

                {/* Stages of Fasting Explanation */}
                <div className="bg-nutraCard rounded-3xl p-4 shadow-sm border border-nutraBorder/60 space-y-3">
                  <h3 className="font-bold text-xs uppercase text-nutraSec">Metabolic Stages</h3>
                  <div className="space-y-2 text-xs">
                    <div className="flex items-center space-x-2 text-nutraGreen font-semibold">
                      <span>✓</span>
                      <span>0-12 hrs: Blood sugar & insulin stabilization</span>
                    </div>
                    <div className="flex items-center space-x-2 text-nutraGreen font-semibold">
                      <span>✓</span>
                      <span>12-14 hrs: Accelerated fat oxidation mode</span>
                    </div>
                    <div className="flex items-center space-x-2 text-nutraSec">
                      <span>○</span>
                      <span>14-16 hrs: Autophagy & cellular repair active</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ======================================================== */}
            {/* TAB 5: PROGRESS & WEEKLY INSIGHTS */}
            {/* ======================================================== */}
            {activeTab === 'progress' && (
              <div className="space-y-4">
                <div className="space-y-1">
                  <h2 className="text-xl font-bold tracking-tight">Progress & Report Card</h2>
                  <p className="text-xs text-nutraSec">Weekly metrics and nutrition consistency.</p>
                </div>

                {/* Weight Trend Card */}
                <div className="bg-nutraCard rounded-3xl p-5 shadow-sm border border-nutraBorder/60 space-y-3">
                  <div className="flex justify-between items-center">
                    <span className="font-bold text-xs">Weight Trend</span>
                    <span className="text-xs font-bold text-nutraGreen">{user.weightKg} kg (-4.3 kg)</span>
                  </div>

                  {/* SVG Minimalist Line Graph */}
                  <div className="h-28 w-full">
                    <svg className="w-full h-full" viewBox="0 0 300 100">
                      <line x1="0" y1="80" x2="300" y2="80" stroke="#34C759" strokeWidth="1" strokeDasharray="4" />
                      <polyline
                        fill="none"
                        stroke="#0A0A0A"
                        strokeWidth="3.5"
                        strokeLinecap="round"
                        points="10,25 65,40 135,48 210,65 290,72"
                      />
                      <circle cx="10" cy="25" r="4" fill="#0A0A0A" />
                      <circle cx="65" cy="40" r="4" fill="#0A0A0A" />
                      <circle cx="135" cy="48" r="4" fill="#0A0A0A" />
                      <circle cx="210" cy="65" r="4" fill="#0A0A0A" />
                      <circle cx="290" cy="72" r="5" fill="#34C759" />
                    </svg>
                  </div>

                  <div className="flex justify-between text-[11px] text-nutraSec pt-1 border-t border-nutraBorder/60">
                    <span>Start: 74.5 kg</span>
                    <span className="font-bold text-black">Current: {user.weightKg} kg</span>
                    <span>Goal: {user.targetWeightKg} kg</span>
                  </div>
                </div>

                {/* 7-Day Calorie Bars */}
                <div className="bg-nutraCard rounded-3xl p-5 shadow-sm border border-nutraBorder/60 space-y-3">
                  <div className="flex justify-between items-center">
                    <span className="font-bold text-xs">7-Day Calorie Adherence</span>
                    <span className="text-xs text-nutraSec">Target: {user.dailyCal} kcal</span>
                  </div>
                  <div className="flex items-end justify-between h-28 pt-2">
                    {[
                      { day: 'Mon', cal: 1890, ok: true },
                      { day: 'Tue', cal: 1940, ok: true },
                      { day: 'Wed', cal: 2100, ok: false },
                      { day: 'Thu', cal: 1820, ok: true },
                      { day: 'Fri', cal: 1910, ok: true },
                      { day: 'Sat', cal: 1980, ok: true },
                      { day: 'Sun', cal: consumedCal, ok: true }
                    ].map(d => {
                      const heightPct = Math.min(100, (d.cal / 2400) * 100);
                      return (
                        <div key={d.day} className="flex flex-col items-center flex-1 space-y-1">
                          <div className="w-6 bg-gray-200 rounded-t-lg h-20 flex items-end overflow-hidden">
                            <div 
                              className={`w-full rounded-t-lg transition-all duration-500 ${d.ok ? 'bg-nutraGreen' : 'bg-nutraAmber'}`}
                              style={{ height: `${heightPct}%` }}
                            ></div>
                          </div>
                          <span className="text-[10px] text-nutraSec font-semibold">{d.day}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Weekly Health Report Card */}
                <div className="bg-nutraCard rounded-3xl p-5 shadow-sm border border-nutraBorder/60 space-y-2">
                  <div className="flex justify-between items-center">
                    <h3 className="font-bold text-sm">Weekly Report Card</h3>
                    <span className="text-xs font-bold text-nutraGreen">Grade A</span>
                  </div>
                  <p className="text-xs text-nutraSec leading-relaxed">
                    Great discipline this week! Your glycemic load was controlled on 6 of 7 days, primarily due to pairing high-fiber millets and probiotic chaas.
                  </p>
                </div>
              </div>
            )}

          </main>

          {/* ============================================================ */}
          {/* BOTTOM NAVIGATION TAB BAR (Cal AI + MyFitnessPal 5 Tabs) */}
          {/* ============================================================ */}
          <nav className="fixed bottom-0 left-0 right-0 mx-auto max-w-md bg-white/95 backdrop-blur-md border-t border-nutraBorder/60 px-2 py-2 flex justify-around items-center z-40">
            {/* Tab 1: Diary */}
            <button 
              onClick={() => setActiveTab('diary')} 
              className={`flex flex-col items-center tap-scale py-1 flex-1 ${activeTab==='diary'?'text-black font-bold':'text-nutraSec'}`}
            >
              <span className="text-xl">📖</span>
              <span className="text-[10px] tracking-tight">{t.diary}</span>
            </button>

            {/* Tab 2: Search */}
            <button 
              onClick={() => setActiveTab('search')} 
              className={`flex flex-col items-center tap-scale py-1 flex-1 ${activeTab==='search'?'text-black font-bold':'text-nutraSec'}`}
            >
              <span className="text-xl">🔍</span>
              <span className="text-[10px] tracking-tight">{t.search}</span>
            </button>

            {/* Tab 3: Elevated Center Scan Button */}
            <div className="-mt-7 flex-shrink-0">
              <button 
                onClick={() => setActiveTab('scan')} 
                className="w-14 h-14 rounded-full bg-nutraText text-white shadow-xl flex items-center justify-center text-2xl tap-scale border-4 border-white ring-2 ring-nutraGreen/30"
              >
                <span className={activeTab === 'scan' ? 'text-nutraGreen' : 'text-white'}>📷</span>
              </button>
            </div>

            {/* Tab 4: Fasting */}
            <button 
              onClick={() => setActiveTab('fasting')} 
              className={`flex flex-col items-center tap-scale py-1 flex-1 ${activeTab==='fasting'?'text-black font-bold':'text-nutraSec'}`}
            >
              <span className="text-xl">⏳</span>
              <span className="text-[10px] tracking-tight">{t.fasting}</span>
            </button>

            {/* Tab 5: Progress */}
            <button 
              onClick={() => setActiveTab('progress')} 
              className={`flex flex-col items-center tap-scale py-1 flex-1 ${activeTab==='progress'?'text-black font-bold':'text-nutraSec'}`}
            >
              <span className="text-xl">📈</span>
              <span className="text-[10px] tracking-tight">{t.progress}</span>
            </button>
          </nav>

          {/* ============================================================ */}
          {/* PROFILE & LOGOUT SLIDE-OVER DRAWER MODAL */}
          {/* ============================================================ */}
          {isProfileOpen && (
            <div className="fixed inset-0 z-50 flex justify-end bg-black/50 backdrop-blur-sm transition-all duration-300">
              {/* Backdrop tap to close */}
              <div className="absolute inset-0" onClick={() => setIsProfileOpen(false)}></div>

              {/* Drawer Sheet */}
              <div className="relative w-full max-w-xs bg-white h-full shadow-2xl p-5 flex flex-col justify-between overflow-y-auto z-10 space-y-4">
                
                <div className="space-y-4">
                  {/* Top Bar with Close */}
                  <div className="flex justify-between items-center border-b border-nutraBorder/60 pb-3">
                    <span className="font-bold text-base">Account & Goals</span>
                    <button 
                      onClick={() => setIsProfileOpen(false)}
                      className="w-8 h-8 rounded-full bg-nutraCard flex items-center justify-center text-sm font-bold text-nutraSec tap-scale"
                    >
                      ✕
                    </button>
                  </div>

                  {/* Profile Header Card */}
                  <div className="bg-nutraCard p-4 rounded-3xl text-center space-y-2 border border-nutraBorder/60">
                    <div className="relative w-16 h-16 mx-auto">
                      <img 
                        src={user.avatar} 
                        alt="Profile" 
                        className="w-full h-full rounded-full object-cover ring-2 ring-nutraGreen" 
                      />
                      <button 
                        onClick={() => alert("Profile photo upload triggered")} 
                        className="absolute bottom-0 right-0 w-5 h-5 bg-black text-white text-[10px] rounded-full flex items-center justify-center shadow"
                      >
                        📷
                      </button>
                    </div>

                    <div>
                      <h3 className="font-bold text-sm text-nutraText">{user.name}</h3>
                      <p className="text-[11px] text-nutraSec">{user.email}</p>
                    </div>

                    <div className="inline-block bg-nutraGreen/15 text-nutraGreen text-[10px] font-bold px-2.5 py-0.5 rounded-full">
                      Nutracal Pro Member
                    </div>
                  </div>

                  {/* Daily Calorie Goal Setting Card */}
                  <div className="bg-nutraCard p-4 rounded-3xl space-y-2 border border-nutraBorder/60">
                    <div className="flex justify-between items-center">
                      <span className="text-xs font-bold text-nutraSec uppercase tracking-wider">Daily Target</span>
                      <button 
                        onClick={() => setIsEditingGoal(!isEditingGoal)} 
                        className="text-xs font-bold text-nutraGreen"
                      >
                        {isEditingGoal ? "Done" : "Edit"}
                      </button>
                    </div>

                    <div className="flex justify-between items-baseline">
                      <span className="text-2xl font-black">{user.dailyCal}</span>
                      <span className="text-xs text-nutraSec">kcal / day</span>
                    </div>

                    {isEditingGoal && (
                      <div className="pt-2 space-y-1">
                        <input 
                          type="range" 
                          min="1200" 
                          max="3200" 
                          step="50"
                          value={user.dailyCal}
                          onChange={(e) => setUser({ ...user, dailyCal: parseInt(e.target.value) })}
                          className="w-full accent-black cursor-pointer"
                        />
                        <div className="flex justify-between text-[10px] text-nutraSec">
                          <span>1200 kcal</span>
                          <span>3200 kcal</span>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Body Metrics */}
                  <div className="bg-nutraCard p-4 rounded-3xl space-y-2 border border-nutraBorder/60 text-xs">
                    <span className="font-bold text-nutraSec uppercase tracking-wider text-[10px]">Body Composition</span>
                    <div className="flex justify-between py-1 border-b border-nutraBorder/40">
                      <span className="text-nutraSec">Current Weight</span>
                      <span className="font-bold text-black">{user.weightKg} kg</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-nutraBorder/40">
                      <span className="text-nutraSec">Target Goal Weight</span>
                      <span className="font-bold text-nutraGreen">{user.targetWeightKg} kg</span>
                    </div>
                    <div className="flex justify-between py-1 border-b border-nutraBorder/40">
                      <span className="text-nutraSec">Height</span>
                      <span className="font-bold text-black">{user.heightCm} cm</span>
                    </div>
                    <div className="flex justify-between py-1">
                      <span className="text-nutraSec">Calculated BMI</span>
                      <span className="font-bold text-nutraGreen">22.6 (Healthy)</span>
                    </div>
                  </div>

                  {/* Sync & Health Connect */}
                  <div className="bg-nutraCard p-3.5 rounded-2xl flex items-center justify-between border border-nutraBorder/60 text-xs">
                    <div className="flex items-center space-x-2">
                      <span>❤️</span>
                      <span className="font-medium">Google Fit / Apple Health</span>
                    </div>
                    <span className="text-[10px] font-bold text-nutraGreen bg-nutraGreen/15 px-2 py-0.5 rounded-full">Synced</span>
                  </div>
                </div>

                {/* LOGOUT & RESET BUTTONS */}
                <div className="space-y-2 pt-2 border-t border-nutraBorder/60">
                  <button 
                    onClick={() => {
                      if (confirm("Reset today's meals and water?")) {
                        setMeals([]);
                        setWaterGlasses(0);
                        setIsProfileOpen(false);
                      }
                    }}
                    className="w-full py-2.5 rounded-2xl border border-nutraBorder text-xs font-bold text-nutraSec hover:text-black tap-scale"
                  >
                    Reset Today's Log
                  </button>

                  <button 
                    onClick={() => {
                      if (confirm("Are you sure you want to log out of Nutracal.ai?")) {
                        alert("Logged out successfully.");
                        setIsProfileOpen(false);
                      }
                    }}
                    className="w-full py-3 rounded-2xl bg-nutraRed/10 text-nutraRed border border-nutraRed/20 text-xs font-bold tap-scale flex items-center justify-center space-x-1"
                  >
                    <span>🚪</span>
                    <span>Log Out of Nutracal.ai</span>
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
